name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to see it
      description: Steps, the page or the request, the version.
    validations:
      required: true
