# An image to the GitHub Container Registry (ghcr.io/<owner>/<repo>), for any repo with a
# Dockerfile: a release (`version` from the release workflow) pushes `1.2.3`, `1.2`, `1` and
# `latest`; without one the default branch pushes `main` and `main-<sha>`.
#
# The caller grants `packages: write`.
name: docker-image

on:
  workflow_call:
    inputs:
      version:
        description: The release's version, e.g. from the release workflow; empty for a branch build.
        type: string
        default: ''
      target:
        description: The Dockerfile stage to build; empty for the last.
        type: string
        default: ''
      context:
        description: The Docker build context.
        type: string
        default: .
      npm-registry-secret:
        description: Give the build the organization's npm registry as the build secret `npmrc` (`RUN --mount=type=secret,id=npmrc,target=…/.npmrc`).
        type: boolean
        default: false
    secrets:
      PACKAGES_TOKEN:
        required: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${REPO,,}"
          if [ -n "$VERSION" ]; then
            set -- "$VERSION" "${VERSION%.*}" "${VERSION%%.*}" latest
          else
            set -- "$BRANCH" "$BRANCH-${SHA::7}"
          fi
          { echo 'list<<EOF'; for t in "$@"; do echo "$image:$t"; done; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ "$NPM_SECRET" = true ]; then
            echo "@${OWNER,,}:registry=https://npm.pkg.github.com" > "$RUNNER_TEMP/npmrc"
            echo "//npm.pkg.github.com/:_authToken=${READ_TOKEN}" >> "$RUNNER_TEMP/npmrc"
            echo "secret-files=npmrc=$RUNNER_TEMP/npmrc" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          NPM_SECRET: ${{ inputs.npm-registry-secret }}
          READ_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Links the image to this repo: it shows there and inherits its access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          secret-files: ${{ steps.tags.outputs.secret-files }}
