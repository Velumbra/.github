# Checks for a Node project on pnpm, in one job so it installs once: lint, format:check,
# typecheck, then test:unit, test:nuxt and test:e2e, each only if package.json has the script. On a
# pull request it first checks the title is a Conventional Commit (the squash commit).
#
# Packages of the scope named like the organization (`@velumbra/*`) install from GitHub Packages.
# The workflow's own token reads only packages this repo may access, so the organization keeps a
# PACKAGES_TOKEN secret (a classic personal access token with `read:packages`), passed with
# `secrets: inherit`; without it the workflow's token is used.
name: node

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js major version.
        type: string
        default: '26'
      pnpm-version:
        description: pnpm version.
        type: string
        default: '12.15.0'
      postgres-image:
        description: A Postgres the tests get (host localhost, password postgres), e.g. postgres:18.6-alpine. Empty for none.
        type: string
        default: ''
      database-url-variable:
        description: With Postgres, the variable the tests read its URL from, e.g. DATABASE_URL.
        type: string
        default: DATABASE_URL
    secrets:
      PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to the same pull request or branch replaces this run.
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        # An empty image starts no service.
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # Squash merging makes the title the commit semantic-release reads.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::The title is the squash commit, so it must be a Conventional Commit, e.g. 'fix(orders): keep the hold on retry' or 'feat!: …'. It is: $TITLE"
            exit 1
          fi
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Registry
        run: |
          echo "@${OWNER,,}:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${TOKEN}" >> .npmrc
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present format:check
      - run: pnpm run --if-present typecheck
      - name: Tests
        run: |
          if [ -n "${{ inputs.postgres-image }}" ]; then
            export "${{ inputs.database-url-variable }}=postgres://postgres:postgres@localhost:5432/postgres"
          fi
          pnpm run --if-present test:unit
          pnpm run --if-present test:nuxt
          pnpm run --if-present test:e2e
