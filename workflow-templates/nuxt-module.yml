name: ci

on:
  push:
    branches: [$default-branch]
    tags: ['v*']
  pull_request:

jobs:
  check:
    uses: velumbra/.github/.github/workflows/node.yml@v0.4.1
    # With database tests:
    # with:
    #   postgres-image: postgres:18.6-alpine
    #   database-url-variable: NUXT_POSTGRES_URL
    secrets: inherit

  release:
    needs: check
    if: github.event_name == 'push'
    uses: velumbra/.github/.github/workflows/release.yml@v0.4.1
    with:
      npm-publish: true
    secrets: inherit
    permissions:
      contents: write
      packages: write
